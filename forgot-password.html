<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu | MEMORY</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f5f2;color:#17221e;font:16px/1.5 system-ui,sans-serif}.card{width:min(420px,calc(100% - 40px));box-sizing:border-box;background:#fff;padding:40px;border:1px solid #dce2dd;border-radius:16px;box-shadow:0 16px 45px #17221e16}h1{margin:0 0 8px;font-size:28px}p{color:#536159}label{display:block;margin:24px 0 7px;font-weight:650}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #b9c7bd;border-radius:8px;font:inherit}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:#1f6a45;color:white;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.message{min-height:24px;margin-top:16px}.error{color:#ab2d2d}.success{color:#1f6a45}a{color:#1f6a45}</style>
</head>
<body><main class="card"><a href="login.html">← Quay lại đăng nhập</a><h1>Đặt lại mật khẩu</h1><p>Nhập email tài khoản. Chúng tôi sẽ gửi cho bạn một liên kết đặt lại mật khẩu.</p><form id="forgot-form"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><button type="submit">Gửi liên kết</button></form><div id="message" class="message" role="alert"></div></main><script type="module" src="/src/forgot-password.ts"></script></body>
</html>

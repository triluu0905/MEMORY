services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory-local-only
      POSTGRES_DB: memory
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - memory-postgres-data:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  memory-postgres-data:
